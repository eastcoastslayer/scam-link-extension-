<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scam Link Detector Admin Dashboard</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

header {
    background: #ff6600;
    color: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-left: 6px solid #ff6600;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h2 {
    margin: 0;
    font-size: 28px;
    color: #ff6600;
}

.card p {
    margin: 5px 0 0;
}

.controls {
    margin-bottom: 20px;
}

button {
    background: #ff6600;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.9;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th {
    background: #ff6600;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.safe {
    color: green;
    font-weight: bold;
}

.suspicious {
    color: orange;
    font-weight: bold;
}

.dangerous {
    color: red;
    font-weight: bold;
}
</style>

</head>
<body>

<header>
    <h1>🛡 Scam Link Detector Dashboard</h1>
    <p>Threat Intelligence & Community Reports</p>
</header>

<div class="stats">

    <div class="card">
        <h2 id="totalReports">0</h2>
        <p>Total Reports</p>
    </div>

    <div class="card">
        <h2 id="safeCount">0</h2>
        <p>Safe</p>
    </div>

    <div class="card">
        <h2 id="suspiciousCount">0</h2>
        <p>Suspicious</p>
    </div>

    <div class="card">
        <h2 id="dangerousCount">0</h2>
        <p>Dangerous</p>
    </div>

</div>

<div class="controls">
    <button onclick="loadReports()">Refresh Reports</button>
</div>

<table>
    <thead>
        <tr>
            <th>Website</th>
            <th>Category</th>
            <th>Risk Score</th>
            <th>Status</th>
            <th>Reason</th>
        </tr>
    </thead>

    <tbody id="reportTable">
    </tbody>

</table>

<script>

async function loadReports() {

    try {

        const response =
        await fetch("http://localhost:3001/api/reports");

        const data =
        await response.json();

        document.getElementById("totalReports").textContent =
        data.totalReports || 0;

        let safe = 0;
        let suspicious = 0;
        let dangerous = 0;

        const table =
        document.getElementById("reportTable");

        table.innerHTML = "";

        data.reports.forEach(report => {

            if(report.status === "Safe") safe++;
            if(report.status === "Suspicious") suspicious++;
            if(report.status === "Dangerous") dangerous++;

            const row =
            document.createElement("tr");

            row.innerHTML = `
                <td>${report.url}</td>
                <td>${report.category}</td>
                <td>${report.riskScore}</td>
                <td class="${report.status.toLowerCase()}">
                    ${report.status}
                </td>
                <td>${report.reason}</td>
            `;

            table.appendChild(row);

        });

        document.getElementById("safeCount").textContent = safe;
        document.getElementById("suspiciousCount").textContent = suspicious;
        document.getElementById("dangerousCount").textContent = dangerous;

    } catch(error) {

        console.error(error);

    }

}

loadReports();

</script>

</body>
</html>
