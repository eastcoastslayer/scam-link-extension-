<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scam Link Detector Dashboard V2</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      padding: 20px;
    }

    header {
      background: #fff;
      border-left: 8px solid #ff6a00;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }

    header h1 {
      margin: 0;
      color: #ff6a00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-top: 5px solid #ff6a00;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.07);
    }

    .stat-card h2 {
      margin: 0;
      color: #ff6a00;
      font-size: 30px;
    }

    .controls {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.07);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-weight: bold;
    }

    button {
      background: #ff6a00;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .table-container {
      background: white;
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 8px 22px rgba(0,0,0,0.07);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: #ff6a00;
      color: white;
      padding: 13px;
      text-align: left;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .safe { color: green; font-weight: bold; }
    .suspicious { color: orange; font-weight: bold; }
    .dangerous { color: red; font-weight: bold; }

    .domain-box {
      background: white;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.07);
    }

    .domain-box h2 {
      color: #ff6a00;
    }

    .small {
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🛡 Scam Link Detector Dashboard V2</h1>
  <p>Threat Intelligence, Community Reports, Risk Monitoring</p>
</header>

<div class="stats-grid">
  <div class="stat-card"><h2 id="totalReports">0</h2><p>Total Reports</p></div>
  <div class="stat-card"><h2 id="safeCount">0</h2><p>Safe</p></div>
  <div class="stat-card"><h2 id="suspiciousCount">0</h2><p>Suspicious</p></div>
  <div class="stat-card"><h2 id="dangerousCount">0</h2><p>Dangerous</p></div>
  <div class="stat-card"><h2 id="topDomain">None</h2><p>Top Reported Domain</p></div>
</div>

<div class="controls">
  <input id="searchInput" type="text" placeholder="Search website, reason, category..." />
  <select id="statusFilter">
    <option value="All">All Statuses</option>
    <option value="Safe">Safe</option>
    <option value="Suspicious">Suspicious</option>
    <option value="Dangerous">Dangerous</option>
  </select>

  <select id="categoryFilter">
    <option value="All">All Categories</option>
  </select>

  <button id="refreshReports">Refresh</button>
  <button id="exportCsv">Export CSV</button>
  <button id="clearReports">Clear All</button>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Website</th>
        <th>Domain</th>
        <th>Category</th>
        <th>Risk</th>
        <th>Status</th>
        <th>Reason</th>
        <th>Reported At</th>
      </tr>
    </thead>
    <tbody id="reportTable">
      <tr><td colspan="7">Loading reports...</td></tr>
    </tbody>
  </table>
</div>

<div class="domain-box">
  <h2>Top Reported Domains</h2>
  <ul id="domainList"></ul>
</div>

<script src="admin.js"></script>
</body>
</html>
